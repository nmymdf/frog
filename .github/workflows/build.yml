name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: 讀取版本號
        id: ver
        run: echo "v=$(grep -oP "VERSION = 'v\K[0-9.]+" www/js/core.js)" >> "$GITHUB_OUTPUT"

      - name: 複製遊戲到 Android assets
        run: bash tools/sync_assets.sh

      - name: 編譯 APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace -PappVersion=${{ steps.ver.outputs.v }} -PappCode=${{ github.run_number }}

      - name: 把 APK 放到 apk 分支
        env:
          VER: ${{ steps.ver.outputs.v }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          rm -rf /tmp/apkrepo
          if git ls-remote --exit-code --heads "$REMOTE" apk >/dev/null 2>&1; then
            git clone --depth 1 --branch apk "$REMOTE" /tmp/apkrepo
          else
            mkdir /tmp/apkrepo && cd /tmp/apkrepo && git init -b apk && git remote add origin "$REMOTE" && cd -
          fi
          cd /tmp/apkrepo
          rm -f FrogCross-*.apk
          cp "$GITHUB_WORKSPACE/$APK" "FrogCross-v${VER}.apk"
          cp "$GITHUB_WORKSPACE/$APK" "FrogCross-latest.apk"
          cat > README.md <<README
          # 青蛙過河 — APK 下載

          作者：ArchieKUO　版本：v${VER}

          - [FrogCross-latest.apk](FrogCross-latest.apk)（永遠是最新版）
          - [FrogCross-v${VER}.apk](FrogCross-v${VER}.apk)

          用手機瀏覽器打開上面的連結下載，允許「安裝不明來源應用程式」後即可安裝。
          README
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APK v${VER} (build ${GITHUB_RUN_NUMBER})"
          git push origin HEAD:apk --force
